name: Start Official Week

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: "Closed week start date (YYYY-MM-DD)"
        required: true
        type: string
      week_end:
        description: "Closed week end date (YYYY-MM-DD)"
        required: true
        type: string
      ranking_date:
        description: "New official ITF ranking date (YYYY-MM-DD)"
        required: true
        type: string
      drop_cutoff:
        description: "Drop cutoff for the staged ledger (YYYY-MM-DD)"
        required: true
        type: string
      new_week_end:
        description: "New live week end date (YYYY-MM-DD)"
        required: true
        type: string
      network_mode:
        description: "Official ranking network mode"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - direct
          - browser
      allow_partial_promotion:
        description: "Promote even when official reconciliation has point divergences"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: official-week-rollover
  cancel-in-progress: false

jobs:
  start-official-week:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      WEEK_START: ${{ inputs.week_start }}
      WEEK_END: ${{ inputs.week_end }}
      RANKING_DATE: ${{ inputs.ranking_date }}
      DROP_CUTOFF: ${{ inputs.drop_cutoff }}
      NEW_WEEK_START: ${{ inputs.ranking_date }}
      NEW_WEEK_END: ${{ inputs.new_week_end }}
      NETWORK_MODE: ${{ inputs.network_mode }}
      ALLOW_PARTIAL_PROMOTION: ${{ inputs.allow_partial_promotion }}
      BACKFILL_DIR: data/backfills/week_${{ inputs.week_start }}_${{ inputs.week_end }}_github_run_${{ github.run_id }}
      WEEK_CLOSE_DIR: data/staging/week_close_${{ inputs.week_end }}
      VALIDATION_DIR: data/staging/official_validation_${{ inputs.ranking_date }}_github_run_${{ github.run_id }}
      RECONCILIATION_DIR: data/staging/official_reconciliation_${{ inputs.ranking_date }}_github_run_${{ github.run_id }}
      LOG_DIR: logs/official-week-rollover
      ARTIFACT_NAME: official-week-rollover-${{ inputs.ranking_date }}-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate rollover scripts
        run: |
          set -euo pipefail
          node --check scripts/17_backfill_week.mjs
          node --check scripts/16_close_week.mjs
          node --check scripts/18_validate_staged_ledger_against_official.mjs
          node --check scripts/19_refresh_selected_breakdowns.mjs
          node --check scripts/20_promote_official_reconciliation.mjs
          node --check scripts/21_weekly_rollover.mjs
          npm test
          npm run check

      - name: Run official week rollover
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$BACKFILL_DIR" "$WEEK_CLOSE_DIR" "$VALIDATION_DIR" "$RECONCILIATION_DIR"

          run_logged() {
            local log_file="$1"
            shift
            echo "Running: $*" | tee "$LOG_DIR/$log_file"
            set +e
            "$@" 2>&1 | tee -a "$LOG_DIR/$log_file"
            local code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then
              echo "Command failed with exit code $code" | tee -a "$LOG_DIR/$log_file"
              return "$code"
            fi
          }

          run_logged backfill_closed_week.log \
            node scripts/17_backfill_week.mjs \
              --week-start="$WEEK_START" \
              --week-end="$WEEK_END" \
              --output-dir="$BACKFILL_DIR" \
              --mode=run

          run_logged close_closed_week.log \
            node scripts/16_close_week.mjs \
              --source-dir="$BACKFILL_DIR" \
              --week-start="$WEEK_START" \
              --week-end="$WEEK_END" \
              --mode=dry-run

          run_logged collect_official_ranking.log \
            node scripts/18_validate_staged_ledger_against_official.mjs \
              --ledger-file="$WEEK_CLOSE_DIR/points_ledger.next.csv" \
              --old-players-file=data/clean/players.csv \
              --old-snapshot-file=data/clean/rankings_snapshot.csv \
              --ranking-date="$RANKING_DATE" \
              --drop-cutoff="$DROP_CUTOFF" \
              --output-dir="$VALIDATION_DIR" \
              --baseline-policy=as-collected \
              --network-mode="$NETWORK_MODE" \
              --mode=run

          run_logged reconcile_official_breakdowns.log \
            node scripts/19_refresh_selected_breakdowns.mjs \
              --validation-dir="$VALIDATION_DIR" \
              --week-close-dir="$WEEK_CLOSE_DIR" \
              --old-players-file=data/clean/players.csv \
              --ranking-date="$RANKING_DATE" \
              --drop-cutoff="$DROP_CUTOFF" \
              --output-dir="$RECONCILIATION_DIR" \
              --network-mode="$NETWORK_MODE" \
              --allow-partial-promotion="$ALLOW_PARTIAL_PROMOTION" \
              --mode=run

          run_logged promote_official_base.log \
            node scripts/20_promote_official_reconciliation.mjs \
              --source-dir="$RECONCILIATION_DIR" \
              --ranking-date="$RANKING_DATE" \
              --mode=apply \
              --allow-partial-promotion="$ALLOW_PARTIAL_PROMOTION" \
              --confirm-promotion=true

          run_logged start_new_week.log \
            npm run weekly:start -- \
              --week-start="$NEW_WEEK_START" \
              --week-end="$NEW_WEEK_END" \
              --mode=apply \
              --confirm=true

      - name: Commit official week data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clean
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No data/clean changes to commit." | tee "$LOG_DIR/git.log"
            exit 0
          fi
          git commit -m "Start official week $RANKING_DATE" 2>&1 | tee "$LOG_DIR/git.log"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push official week data
        if: steps.commit.outputs.committed == 'true'
        run: git push origin HEAD:main

      - name: Dispatch Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Write rollover summary
        run: |
          set -euo pipefail
          {
            echo "# Start Official Week"
            echo ""
            echo "- closed week: $WEEK_START to $WEEK_END"
            echo "- official ranking_date: $RANKING_DATE"
            echo "- new live week: $NEW_WEEK_START to $NEW_WEEK_END"
            echo "- committed: ${{ steps.commit.outputs.committed }}"
            echo "- deploy dispatched: ${{ steps.commit.outputs.committed }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollover artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            data/backfills/
            data/staging/
            logs/official-week-rollover/
          retention-days: 7
