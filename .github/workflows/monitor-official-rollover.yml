name: Check Official Ranking Date

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor-official-rollover.yml"
      - "scripts/18_validate_staged_ledger_against_official.mjs"
      - "scripts/25_monitor_official_rollover.mjs"
  workflow_dispatch:
    inputs:
      old_ranking_date:
        description: "Current local official ranking date (optional, YYYY-MM-DD)"
        required: false
        type: string
      expected_ranking_date:
        description: "Expected new official ranking date (optional, YYYY-MM-DD)"
        required: false
        type: string
      week_start:
        description: "Closed week start date (optional, YYYY-MM-DD)"
        required: false
        type: string
      week_end:
        description: "Closed week end date (optional, YYYY-MM-DD)"
        required: false
        type: string
      drop_cutoff:
        description: "Drop cutoff for the staged ledger (optional, YYYY-MM-DD)"
        required: false
        type: string
      network_mode:
        description: "Official ranking network mode"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - direct
          - browser
  schedule:
    - cron: "17 9-21 * * 1"
    - cron: "17 9-18 * * 2"

permissions:
  actions: write
  contents: read

concurrency:
  group: official-rollover-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      NETWORK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.network_mode || 'auto' }}
      OLD_RANKING_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.old_ranking_date || '' }}
      EXPECTED_RANKING_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_ranking_date || '' }}
      INPUT_WEEK_START: ${{ github.event_name == 'workflow_dispatch' && inputs.week_start || '' }}
      INPUT_WEEK_END: ${{ github.event_name == 'workflow_dispatch' && inputs.week_end || '' }}
      INPUT_DROP_CUTOFF: ${{ github.event_name == 'workflow_dispatch' && inputs.drop_cutoff || '' }}
      MONITOR_DIR: data/staging/official_ranking_date_monitor_${{ github.run_id }}
      LOG_DIR: logs/official-ranking-date-monitor
      ARTIFACT_NAME: official-ranking-date-monitor-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate monitor script
        run: node --check scripts/25_monitor_official_rollover.mjs

      - name: Check official ranking date
        id: monitor
        run: |
          set -euo pipefail
          mkdir -p "$MONITOR_DIR" "$LOG_DIR"
          node scripts/25_monitor_official_rollover.mjs \
            --network-mode="$NETWORK_MODE" \
            --old-ranking-date="$OLD_RANKING_DATE" \
            --expected-ranking-date="$EXPECTED_RANKING_DATE" \
            --week-start="$INPUT_WEEK_START" \
            --week-end="$INPUT_WEEK_END" \
            --drop-cutoff="$INPUT_DROP_CUTOFF" \
            --output-file="$MONITOR_DIR/monitor_summary.json" 2>&1 | tee "$LOG_DIR/monitor.log"

      - name: Write monitor summary
        if: steps.monitor.outputs.should_run_rollover != 'true'
        run: |
          set -euo pipefail
          node - "$MONITOR_DIR/monitor_summary.json" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const summary = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("# Check Official Ranking Date");
          console.log("");
          console.log(`- status: ${summary.status}`);
          console.log(`- local ranking_date: ${summary.old_ranking_date}`);
          console.log(`- expected ranking_date: ${summary.expected_ranking_date}`);
          console.log(`- detected ITF ranking_date: ${summary.detected_ranking_date || "not available"}`);
          console.log(`- rollover dispatched: false`);
          if (summary.error) console.log(`- error: ${summary.error}`);
          NODE

      - name: Dispatch official week rollover
        if: steps.monitor.outputs.should_run_rollover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run official-week-rollover.yml \
            --ref main \
            -f week_start="${{ steps.monitor.outputs.week_start }}" \
            -f week_end="${{ steps.monitor.outputs.week_end }}" \
            -f ranking_date="${{ steps.monitor.outputs.expected_ranking_date }}" \
            -f drop_cutoff="${{ steps.monitor.outputs.drop_cutoff }}" \
            -f new_week_end="${{ steps.monitor.outputs.new_week_end }}" \
            -f network_mode="$NETWORK_MODE"

      - name: Write dispatch summary
        if: steps.monitor.outputs.should_run_rollover == 'true'
        run: |
          set -euo pipefail
          {
            echo "# Check Official Ranking Date"
            echo ""
            echo "- status: updated"
            echo "- detected ITF ranking_date: ${{ steps.monitor.outputs.detected_ranking_date }}"
            echo "- dispatched workflow: official-week-rollover.yml"
            echo "- closed week: ${{ steps.monitor.outputs.week_start }} to ${{ steps.monitor.outputs.week_end }}"
            echo "- new week: ${{ steps.monitor.outputs.new_week_start }} to ${{ steps.monitor.outputs.new_week_end }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload monitor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.MONITOR_DIR }}
            logs/official-ranking-date-monitor/
          retention-days: 7
