name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 10,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore generated data cache
        uses: actions/cache@v4
        with:
          path: |
            data/clean/week_tournaments.csv
            data/clean/week_tournaments_debug_all.csv
            data/clean/week_matches.csv
            data/clean/week_player_results.csv
            data/clean/week_results_errors.csv
            data/clean/week_results_summary.csv
            data/clean/week_live_points.csv
            data/clean/week_live_ledger_rows.csv
            data/clean/live_combined_ledger_with_drops.csv
            data/clean/live_dropped_points.csv
            data/clean/live_ranking_with_drops.csv
            data/clean/live_ranking_with_drops_top500.csv
            data/clean/live_ranking_with_drops_changes.csv
          key: live-ranking-data-${{ github.run_id }}
          restore-keys: |
            live-ranking-data-

      - name: Backup last valid generated data
        if: github.event_name != 'push'
        run: |
          mkdir -p .last-valid-data/data/clean
          files=(
            week_tournaments.csv
            week_tournaments_debug_all.csv
            week_matches.csv
            week_player_results.csv
            week_results_errors.csv
            week_results_summary.csv
            week_live_points.csv
            week_live_ledger_rows.csv
            live_combined_ledger_with_drops.csv
            live_dropped_points.csv
            live_ranking_with_drops.csv
            live_ranking_with_drops_top500.csv
            live_ranking_with_drops_changes.csv
          )
          for file in "${files[@]}"; do
            if [ -f "data/clean/$file" ]; then
              cp "data/clean/$file" ".last-valid-data/data/clean/$file"
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]')
        run: npx playwright install --with-deps chromium

      - name: Check cached data for push deploy
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[fresh-pages]')
        run: |
          node -e "const fs=require('fs'); const files=['data/clean/week_tournaments.csv','data/clean/week_matches.csv','data/clean/week_player_results.csv']; const missing=files.filter((file)=>!fs.existsSync(file)); if (missing.length) { console.error('Missing generated data cache for push deploy:'); for (const file of missing) console.error('- '+file); console.error('Run the workflow manually once to execute npm run update:full and refresh the cache.'); process.exit(1); }"

      - name: Build live ranking without scraping
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[fresh-pages]')
        run: npm run update

      - name: Build live ranking with fresh ITF data
        id: scrape
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]')
        continue-on-error: true
        run: npm run update:full

      - name: Restore last valid data after scraping failure
        if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]')) && steps.scrape.outcome == 'failure'
        run: |
          echo "ITF scraping failed. Restoring the last valid generated data from cache."
          for file in week_tournaments.csv week_matches.csv week_player_results.csv; do
            if [ ! -f ".last-valid-data/data/clean/$file" ]; then
              echo "Missing required cached file: .last-valid-data/data/clean/$file"
              echo "No valid cached data is available to restore after scraping failure."
              exit 1
            fi
          done
          mkdir -p data/clean
          files=(
            week_tournaments.csv
            week_tournaments_debug_all.csv
            week_matches.csv
            week_player_results.csv
            week_results_errors.csv
            week_results_summary.csv
            week_live_points.csv
            week_live_ledger_rows.csv
            live_combined_ledger_with_drops.csv
            live_dropped_points.csv
            live_ranking_with_drops.csv
            live_ranking_with_drops_top500.csv
            live_ranking_with_drops_changes.csv
          )
          for file in "${files[@]}"; do
            if [ -f ".last-valid-data/data/clean/$file" ]; then
              cp -f ".last-valid-data/data/clean/$file" "data/clean/$file"
            fi
          done

      - name: Build live ranking from last valid data
        if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]')) && steps.scrape.outcome == 'failure'
        run: npm run update

      - name: Report stale ITF data
        if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]')) && steps.scrape.outcome == 'failure'
        run: |
          echo "WARNING: ITF scraping failed. GitHub Pages will be deployed using the last valid cached data."

      - name: Write weekly scraping summary
        if: always()
        env:
          ITF_SCRAPE_FRESH: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]')) && steps.scrape.outcome == 'success' }}
        run: node scripts/24_write_week_action_summary.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/exports

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
