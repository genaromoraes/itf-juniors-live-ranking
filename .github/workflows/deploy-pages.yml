name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      use_committed_data:
        description: "Publicar usando os dados já validados no commit, sem nova coleta no ITF"
        required: false
        default: false
        type: boolean
  schedule:
    # Five daily reads from 08:00 to 20:00 in Brasilia; cron values below are UTC.
    - cron: "0 11,14,17,20,23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A fresh publication after the official rollover must rebuild the
    # ranking universe before the coherence check. The 32-minute pipeline
    # limit was reached while the ITF API was still returning pages.
    timeout-minutes: 90
    env:
      GOOGLE_ANALYTICS_ID: G-D6CG6ZH0P1
      ITF_PIPELINE_TIMEOUT_MS: "3600000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore generated data cache
        id: generated_cache
        uses: actions/cache@v4
        with:
          path: |
            data/clean/week_tournaments.csv
            data/clean/week_tournaments_debug_all.csv
            data/clean/week_matches.csv
            data/clean/week_player_results.csv
            data/clean/week_results_errors.csv
            data/clean/week_results_summary.csv
            data/clean/week_live_points.csv
            data/clean/week_live_ledger_rows.csv
            data/clean/rankings_universe.csv
            data/clean/live_combined_ledger_with_drops.csv
            data/clean/live_dropped_points.csv
            data/clean/live_ranking_with_drops.csv
            data/clean/live_ranking_with_drops_top500.csv
            data/clean/live_ranking_with_drops_changes.csv
          key: live-ranking-data-${{ github.run_id }}
          restore-keys: |
            live-ranking-data-

      - name: Check cached data for push deploy
        id: push_cache
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            'data/clean/week_tournaments.csv',
            'data/clean/week_matches.csv',
            'data/clean/week_player_results.csv',
          ];
          const missing = required.filter((file) => !fs.existsSync(file));
          const readFirstValue = (file, column) => {
            if (!fs.existsSync(file)) return '';
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            if (lines.length < 2) return '';
            const headers = lines[0].split(',');
            const index = headers.indexOf(column);
            return index >= 0 ? lines[1].split(',')[index] : '';
          };
          const officialDate = readFirstValue('data/clean/rankings_snapshot.csv', 'ranking_date');
          const cachedWeekStart = readFirstValue('data/clean/week_tournaments.csv', 'week_start');
          const cacheMatchesOfficialWeek = Boolean(officialDate && cachedWeekStart && officialDate === cachedWeekStart);
          const hasCache = missing.length === 0 && cacheMatchesOfficialWeek;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_cache=${hasCache ? 'true' : 'false'}\n`);
          if (hasCache) {
            console.log(`Push deploy will reuse cached generated data for ${cachedWeekStart}.`);
          } else {
            console.log('Push deploy cache is incomplete or belongs to an older official week; switching to fresh ITF scrape.');
            for (const file of missing) console.log('- missing: ' + file);
            if (officialDate || cachedWeekStart) {
              console.log(`- official ranking date: ${officialDate || '<missing>'}`);
              console.log(`- cached week start: ${cachedWeekStart || '<missing>'}`);
            }
          }
          NODE

      - name: Backup last valid generated data
        if: github.event_name != 'push' || steps.push_cache.outputs.has_cache == 'true'
        run: |
          mkdir -p .last-valid-data/data/clean
          files=(
            week_tournaments.csv
            week_tournaments_debug_all.csv
            week_matches.csv
            week_player_results.csv
            week_results_errors.csv
            week_results_summary.csv
            week_live_points.csv
            week_live_ledger_rows.csv
            rankings_universe.csv
            live_combined_ledger_with_drops.csv
            live_dropped_points.csv
            live_ranking_with_drops.csv
            live_ranking_with_drops_top500.csv
            live_ranking_with_drops_changes.csv
          )
          for file in "${files[@]}"; do
            if [ -f "data/clean/$file" ]; then
              cp "data/clean/$file" ".last-valid-data/data/clean/$file"
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: >
          inputs.use_committed_data != true &&
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]') || steps.push_cache.outputs.has_cache != 'true')
        run: npx playwright install --with-deps chromium

      - name: Build live ranking without scraping
        if: >
          (github.event_name == 'push' && !contains(github.event.head_commit.message, '[fresh-pages]') && steps.push_cache.outputs.has_cache == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.use_committed_data == true)
        run: npm run update

      - name: Build live ranking with fresh ITF data
        id: scrape
        if: >
          inputs.use_committed_data != true &&
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]') || steps.push_cache.outputs.has_cache != 'true')
        continue-on-error: true
        run: npm run update:full

      - name: Restore last valid data after scraping failure
        if: >
          inputs.use_committed_data != true &&
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]') || steps.push_cache.outputs.has_cache != 'true') &&
          steps.scrape.outcome == 'failure' &&
          (github.event_name != 'push' || steps.push_cache.outputs.has_cache == 'true')
        run: |
          echo "ITF scraping failed. Restoring the last valid generated data from cache."
          for file in week_tournaments.csv week_matches.csv week_player_results.csv; do
            if [ ! -f ".last-valid-data/data/clean/$file" ]; then
              echo "Missing required cached file: .last-valid-data/data/clean/$file"
              echo "No valid cached data is available to restore after scraping failure."
              exit 1
            fi
          done
          mkdir -p data/clean
          files=(
            week_tournaments.csv
            week_tournaments_debug_all.csv
            week_matches.csv
            week_player_results.csv
            week_results_errors.csv
            week_results_summary.csv
            week_live_points.csv
            week_live_ledger_rows.csv
            rankings_universe.csv
            live_combined_ledger_with_drops.csv
            live_dropped_points.csv
            live_ranking_with_drops.csv
            live_ranking_with_drops_top500.csv
            live_ranking_with_drops_changes.csv
          )
          for file in "${files[@]}"; do
            if [ -f ".last-valid-data/data/clean/$file" ]; then
              cp -f ".last-valid-data/data/clean/$file" "data/clean/$file"
            fi
          done

      - name: Build live ranking from last valid data
        if: >
          inputs.use_committed_data != true &&
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]') || steps.push_cache.outputs.has_cache != 'true') &&
          steps.scrape.outcome == 'failure' &&
          (github.event_name != 'push' || steps.push_cache.outputs.has_cache == 'true')
        run: npm run update

      - name: Report stale ITF data
        if: >
          inputs.use_committed_data != true &&
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]') || steps.push_cache.outputs.has_cache != 'true') &&
          steps.scrape.outcome == 'failure' &&
          (github.event_name != 'push' || steps.push_cache.outputs.has_cache == 'true')
        run: |
          echo "WARNING: ITF scraping failed. GitHub Pages will be deployed using the last valid cached data."

      - name: Write weekly scraping summary
        if: >
          inputs.use_committed_data != true &&
          (github.event_name != 'push' || contains(github.event.head_commit.message, '[fresh-pages]') || steps.push_cache.outputs.has_cache != 'true') &&
          steps.scrape.outcome == 'success'
        env:
          ITF_SCRAPE_FRESH: "true"
        run: node scripts/24_write_week_action_summary.mjs

      - name: Validate publication coherence
        run: npm run validate:publication

      - name: Upload failed publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages-publication-${{ github.run_id }}
          path: |
            logs/
            data/clean/week_results_errors.csv
            data/clean/week_results_summary.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/exports

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
