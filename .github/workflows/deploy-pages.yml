name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      use_committed_data:
        description: "Publicar usando os dados já validados no commit, sem nova coleta no ITF"
        required: false
        default: false
        type: boolean
  schedule:
    # Five daily reads from 08:00 to 20:00 in Brasilia; cron values below are UTC.
    - cron: "0 11,14,17,20,23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # One weekly pipeline: collect current results, calculate the live ranking,
    # write the run summary, validate coherence, and deploy Pages.
    timeout-minutes: 90
    env:
      GOOGLE_ANALYTICS_ID: G-D6CG6ZH0P1
      ITF_PIPELINE_TIMEOUT_MS: "5400000"
      ITF_SKIP_RANKINGS_UNIVERSE_FETCH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
      ITF_RESULTS_MAX_RETRIES: "2"
      ITF_RESULTS_BLOCK_DELAY_MS: "15000"
      ITF_RESULTS_RETRY_DELAY_MS: "10000"
      ITF_RESULTS_EVENT_DELAY_MS: "2000"
      ITF_RESULTS_TOURNAMENT_DELAY_MS: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check committed data before cache restore
        id: committed_data
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = [
            'data/clean/rankings_snapshot.csv',
            'data/clean/week_tournaments.csv',
            'data/clean/week_matches.csv',
            'data/clean/week_player_results.csv',
          ];
          const missing = required.filter((file) => !fs.existsSync(file));
          const readFirstValue = (file, column) => {
            if (!fs.existsSync(file)) return '';
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            if (lines.length < 2) return '';
            const headers = lines[0].split(',');
            const index = headers.indexOf(column);
            return index >= 0 ? lines[1].split(',')[index] : '';
          };
          const officialDate = readFirstValue('data/clean/rankings_snapshot.csv', 'ranking_date');
          const committedWeekStart = readFirstValue('data/clean/week_tournaments.csv', 'week_start');
          const valid = missing.length === 0 && Boolean(officialDate && committedWeekStart && officialDate === committedWeekStart);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `valid=${valid ? 'true' : 'false'}\n`);
          if (valid) {
            console.log(`Committed publication package is coherent for ${committedWeekStart}.`);
          } else {
            console.log('Committed publication package is incomplete or has a different official week.');
            for (const file of missing) console.log('- missing: ' + file);
            if (officialDate || committedWeekStart) {
              console.log(`- official ranking date: ${officialDate || '<missing>'}`);
              console.log(`- committed week start: ${committedWeekStart || '<missing>'}`);
            }
          }
          NODE

      - name: Restore previous weekly package for comparison
        id: previous_week_cache
        uses: actions/cache@v4
        with:
          path: .previous-run/data/clean
          key: weekly-results-${{ github.run_id }}
          restore-keys: |
            weekly-results-

      - name: Backup committed publication package
        run: |
          mkdir -p .last-valid-data/data/clean
          files=(
            week_tournaments.csv
            week_tournaments_debug_all.csv
            week_matches.csv
            week_player_results.csv
            week_results_errors.csv
            week_results_summary.csv
            week_live_points.csv
            week_live_ledger_rows.csv
            rankings_universe.csv
            live_combined_ledger_with_drops.csv
            live_dropped_points.csv
            live_ranking_with_drops.csv
            live_ranking_with_drops_top500.csv
            live_ranking_with_drops_changes.csv
          )
          for file in "${files[@]}"; do
            if [ -f "data/clean/$file" ]; then
              cp "data/clean/$file" ".last-valid-data/data/clean/$file"
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: >
          inputs.use_committed_data != true &&
          !(
            (github.event_name == 'push' && steps.committed_data.outputs.valid == 'true' && !contains(github.event.head_commit.message, '[fresh-pages]'))
          )
        run: npx playwright install --with-deps chromium

      - name: Build live ranking without scraping
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.use_committed_data == true) ||
          (github.event_name == 'push' && steps.committed_data.outputs.valid == 'true' && !contains(github.event.head_commit.message, '[fresh-pages]'))
        run: npm run update

      - name: Build live ranking with fresh ITF data
        id: scrape
        if: >
          !(
            (github.event_name == 'workflow_dispatch' && inputs.use_committed_data == true) ||
            (github.event_name == 'push' && steps.committed_data.outputs.valid == 'true' && !contains(github.event.head_commit.message, '[fresh-pages]'))
          )
        continue-on-error: true
        run: npm run update:full

      - name: Restore last valid data after scraping failure
        if: steps.scrape.outcome == 'failure'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const requiredFiles = [
            'week_tournaments.csv',
            'week_matches.csv',
            'week_player_results.csv',
          ];
          const optionalFiles = [
            'week_tournaments_debug_all.csv',
            'week_results_errors.csv',
            'week_results_summary.csv',
          ];
          const files = [...requiredFiles, ...optionalFiles];
          const cleanDir = path.resolve('data/clean');
          const committedDir = path.resolve('.last-valid-data/data/clean');
          const previousDir = path.resolve('.previous-run/data/clean');
          const readFirst = (file, column) => {
            if (!fs.existsSync(file)) return '';
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            if (lines.length < 2) return '';
            const headers = lines[0].split(',');
            const index = headers.indexOf(column);
            return index >= 0 ? lines[1].split(',')[index] : '';
          };
          const officialDate = readFirst(
            path.resolve('data/clean/rankings_snapshot.csv'),
            'ranking_date'
          );
          const previousWeek = readFirst(path.join(previousDir, 'week_tournaments.csv'), 'week_start');
          const committedWeek = readFirst(path.join(committedDir, 'week_tournaments.csv'), 'week_start');
          const previousComplete = requiredFiles.every((file) => fs.existsSync(path.join(previousDir, file)));
          const usePrevious = previousComplete && previousWeek && previousWeek === officialDate;
          const sourceDir = usePrevious ? previousDir : committedDir;

          console.log(`Scrape falhou; restaurando ${usePrevious ? 'o ultimo pacote semanal valido' : 'o pacote commitado'}.`);
          if (!fs.existsSync(sourceDir) || !requiredFiles.every((file) => fs.existsSync(path.join(sourceDir, file)))) {
            throw new Error('Nenhum pacote semanal completo esta disponivel para fallback.');
          }
          if (!usePrevious && committedWeek !== officialDate) {
            console.log(`Pacote commitado tambem esta em ${committedWeek || '<ausente>'}; a validacao bloqueara a publicacao incoerente.`);
          }
          fs.mkdirSync(cleanDir, { recursive: true });
          for (const file of files) {
            const sourceFile = path.join(sourceDir, file);
            if (fs.existsSync(sourceFile)) {
              fs.copyFileSync(sourceFile, path.join(cleanDir, file));
            }
          }
          NODE

      - name: Build live ranking from last valid data
        if: steps.scrape.outcome == 'failure'
        run: npm run update

      - name: Report stale ITF data
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "WARNING: ITF scraping failed. GitHub Pages will be rebuilt from the last coherent weekly package."

      - name: Write weekly scraping summary
        if: steps.scrape.outcome == 'success'
        env:
          ITF_SCRAPE_FRESH: "true"
          PREVIOUS_WEEK_MATCHES_FILE: .previous-run/data/clean/week_matches.csv
          PREVIOUS_WEEK_TOURNAMENTS_FILE: .previous-run/data/clean/week_tournaments.csv
        run: node scripts/24_write_week_action_summary.mjs

      - name: Validate publication coherence
        run: npm run validate:publication

      - name: Stage weekly package for next run
        if: success()
        run: |
          set -euo pipefail
          mkdir -p .previous-run/data/clean
          for file in week_tournaments.csv week_tournaments_debug_all.csv week_matches.csv week_player_results.csv week_results_errors.csv week_results_summary.csv; do
            if [ -f "data/clean/$file" ]; then
              cp -f "data/clean/$file" ".previous-run/data/clean/$file"
            fi
          done

      - name: Upload failed publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages-publication-${{ github.run_id }}
          path: |
            logs/
            data/clean/week_results_errors.csv
            data/clean/week_results_summary.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/exports

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
